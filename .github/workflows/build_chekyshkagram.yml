name: Build Chekushkagram iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Chekushkagram IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          which bazelisk
          bazelisk --version

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Build Configuration
        run: |
          mkdir -p build-input/remote-input/certs
          mkdir -p build-input/remote-input/profiles
          mkdir -p artifacts
          # Patch rules_apple to allow building device IPA without requiring a provisioning profile
          python3 -c "p = 'build-system/bazel-rules/rules_apple/apple/internal/partials/provisioning_profile.bzl'; c = open(p).read(); open(p, 'w').write(c.replace('if not profile_artifact:\n        fail(', 'if not profile_artifact:\n        return struct()\n        fail('))"
          python3 -c "p = 'build-system/bazel-rules/rules_apple/apple/internal/codesigning_support.bzl'; c = open(p).read(); open(p, 'w').write(c.replace('rule_descriptor.requires_signing_for_device and\n        not provisioning_profile):\n        fail(', 'rule_descriptor.requires_signing_for_device and\n        not provisioning_profile):\n        return\n        fail('))"

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: /Users/runner/bazel-disk-cache
          key: bazel-cache-${{ runner.os }}-xcode15.4-${{ github.ref }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-xcode15.4-

      - name: Build Chekushkagram IPA
        run: |
          mkdir -p /Users/runner/bazel-disk-cache
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --cacheDir=/Users/runner/bazel-disk-cache \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --disableExtensions \
            --configuration=release_arm64 \
            --enableParallelSwiftmoduleGeneration \
            --buildNumber=10001 \
            --outputBuildArtifactsPath=artifacts

      - name: Find and Package IPA
        run: |
          echo "Listing artifacts directory..."
          ls -la artifacts/ || true
          find . -name "*.ipa" -o -name "Telegram.app" -o -name "Chekushkagram.app"

          # Copy Telegram.ipa to Chekushkagram.ipa if present:
          if [ -f artifacts/Telegram.ipa ]; then
            echo "Copying artifacts/Telegram.ipa to artifacts/Chekushkagram.ipa..."
            cp artifacts/Telegram.ipa artifacts/Chekushkagram.ipa
          elif [ ! -f artifacts/Chekushkagram.ipa ]; then
            APP_PATH=$(find bazel-out artifacts -name "*.app" -maxdepth 4 | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Packaging $APP_PATH into Chekushkagram.ipa..."
              mkdir -p Payload
              cp -R "$APP_PATH" Payload/
              zip -qr artifacts/Chekushkagram.ipa Payload
              rm -rf Payload
            fi
          fi

      - name: Upload Chekushkagram IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chekushkagram-iOS-IPA
          path: |
            artifacts/*.ipa
            bazel-bin/Telegram/*.ipa
          if-no-files-found: warn
